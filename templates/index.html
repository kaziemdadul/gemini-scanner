<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jio Gemini Scanner Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <h1>Gemini Scanner <span>Pro</span></h1>
            </div>
            <div class="status-badge" id="status-badge">Ready</div>
        </header>

        <main>
            <div class="control-panel glass-panel">
                <div class="panel-header">
                    <h2>Scanner Controls</h2>
                    <p>Initialize the massive concurrent scanning process across all Firebase panels.</p>
                </div>
                <div class="action-area">
                    <button id="start-btn" class="primary-btn">
                        <span class="btn-text">INITIALIZE SCAN</span>
                        <span class="btn-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </span>
                    </button>
                </div>
                <div class="stats-preview">
                    <div class="stat-item">
                        <span class="stat-label">Panels</span>
                        <span class="stat-value">55+</span>
                    </div>
                </div>
                
                <div class="download-area">
                    <h3 class="section-title">Results Export</h3>
                    <div class="download-buttons">
                        <a href="/download/gemini_activation_links.txt" class="secondary-btn" target="_blank">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Links (.txt)
                        </a>
                        <a href="/download/gemini_results.csv" class="secondary-btn" target="_blank">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Data (.csv)
                        </a>
                    </div>
                </div>
            </div>

            <div class="terminal-container glass-panel">
                <div class="terminal-header">
                    <div class="window-controls">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>
                    <span class="terminal-title">system_logs.sh</span>
                </div>
                <div class="terminal-body" id="terminal">
                    <div class="log-line system">Waiting for scan initialization...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
